<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linktree</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</head>
<body>
    <!-- Div1-->
    <div class="container">
        <div class="imagem">
            <img src="images/logo.jpg" alt="Apotecario">
        </div>
        
        <h1> Eu sou o Apotecário </h1>
        <h6> sigam @apotecariorpg   </h6>
        <ul>
            <li><a href="https://www.instagram.com/apotecariorpg"><box-icon type='logo' name='instagram'></box-icon></a></li>
            <li><a href="https://www.tiktok.com/@apotecariorpg"> <box-icon type='logo' name='tiktok'></box-icon> </a></li>
            <li><a href="https://www.twitch.tv/apotecariorpg"> <box-icon type='logo' name='twitch'></box-icon> </a></li>
        </ul>
        <!-- Div2-->
        <div class="butons">
            <a href="https://www.instagram.com/apotecariorpg"> Instagram do Apotecário! </a>
            <a href="https://www.tiktok.com/@apotecariorpg"> Tiktok do Apotecário! </a>
            <a href="https://www.twitch.tv/apotecariorpg"> Twitch do Apotecário! </a>
        </div>
    </div>
</body>
</html>
